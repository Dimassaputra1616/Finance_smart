<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#193b2d" />
      <stop offset="50%" stop-color="#142d22" />
      <stop offset="100%" stop-color="#0a1711" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5dfa6" />
      <stop offset="50%" stop-color="#e8c77b" />
      <stop offset="100%" stop-color="#c49a45" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#c49a45" stroke-width="8" />
  <!-- Inner Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="rgba(232, 199, 123, 0.2)" stroke-width="2" />
  <!-- Currency Monogram "Rp" -->
  <text
    x="256"
    y="320"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace"
    font-size="220"
    font-weight="800"
    letter-spacing="-8"
    fill="url(#gold)"
    text-anchor="middle"
    dominant-baseline="middle"
  >
    Rp
  </text>
</svg>
