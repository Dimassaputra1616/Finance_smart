<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Koneksi Terputus · Perbendaharaan</title>
    <style>
      :root {
        color-scheme: dark light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d1a14;
        color: #f0f4f1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 380px;
        text-align: center;
        background: #14281e;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 32px 24px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: rgba(232, 199, 123, 0.12);
        color: #e8c77b;
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 700;
        font-family: monospace;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.15rem;
        font-weight: 700;
        color: #f0f4f1;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        font-size: 0.85rem;
        color: #8c9f95;
        line-height: 1.5;
      }
      button {
        background: #e8c77b;
        color: #060e0a;
        border: none;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      button:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">Rp</div>
      <h1>Koneksi Terputus</h1>
      <p>
        Sistem perbendaharaan membutuhkan jaringan aktif untuk menjaga konsistensi saldo kas. Sambungkan kembali perangkat Anda.
      </p>
      <button onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
  </body>
</html>
